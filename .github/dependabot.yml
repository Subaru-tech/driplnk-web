version: 2
updates:
  # npm dependencies — weekly; group non-breaking bumps to keep PRs small.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Security-only updates for major bumps; review those manually.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Keep the two pinned official actions current too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
