name: RLS regression probes

on:
  push:
    paths:
      - "supabase/**"
      - ".github/workflows/rls-regression.yml"
  pull_request:
    paths:
      - "supabase/**"
  workflow_dispatch:

# Phase 8b: least-privilege workflow token. This workflow only reads the
# repository (checkout) and calls the Supabase Management API with its own
# secret — it never needs write scopes.
permissions:
  contents: read

jobs:
  rls-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run RLS regression probes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ]; then
            echo "::notice::Set SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF repository secrets to enable the RLS probes. Skipping."
            exit 0
          fi
          node supabase/tests/rls_regression.mjs

      - name: Run SLA/accept race probes
        if: vars.RUN_RACE_PROBES == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node supabase/tests/sla_accept_race.mjs
